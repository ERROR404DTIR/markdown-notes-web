<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Markdown Notes Web</title><desc id="d">A note editor pairs Markdown source with a clean reading preview.</desc><defs><linearGradient id="bg"><stop stop-color="#19273e"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect x="85" y="75" width="465" height="170" rx="12" fill="#0c192a" stroke="#8fa8ff" stroke-width="2"/><rect x="650" y="75" width="465" height="170" rx="12" fill="#102a30" stroke="#62e3c1" stroke-width="2"/><g fill="#91a0ba"><rect x="120" y="112" width="210" height="10" rx="5"/><rect x="120" y="145" width="350" height="10" rx="5"/><rect x="120" y="178" width="280" height="10" rx="5"/></g><g fill="#edf3ff" font-family="Arial,sans-serif"><text x="690" y="125" font-size="24" font-weight="700">A clear note</text><text x="690" y="165" font-size="16">Saved locally in your browser</text></g><path d="M550 160H650" stroke="#62e3c1" stroke-width="4" stroke-dasharray="9 9"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.5s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">MARKDOWN NOTES WEB</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">WRITE / PREVIEW / SAVE</text></svg>